version: 1.0.0

levain.pkg.skipInstallDir: true

dependencies:
    - git

cmd.install:
    - contextMenu folders --id="levain-git-bash" --name="Git Bash Here" --cmd="\"${pkg.git.baseDir}\\git-bash.exe\" \"--cd=%1\""
    - contextMenu background --id="levain-git-bash-bg" --name="Git Bash Here" --cmd="\"${pkg.git.baseDir}\\git-bash.exe\" \"--cd=%V\""
