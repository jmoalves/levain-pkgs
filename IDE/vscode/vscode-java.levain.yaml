version: 1.0.0

levain.pkg.skipInstallDir: true

dependencies:
    - vscode
    - jdk-21-ibm-latest

cmd.install:
    - mkdir ${APPDATA}/Code/User
    - backupFile ${APPDATA}/Code/User/settings.json
    - jsonSet ${APPDATA}/Code/User/settings.json [java.jdt.ls.java.home] ${pkg.jdk-21-ibm-latest.baseDir}
