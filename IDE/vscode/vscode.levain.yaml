version: 1.148.0

dependencies:

downloadUrl: https://update.code.visualstudio.com/${version}/win32-x64-archive/stable

cmd.install:
    - extract --type zip ${downloadUrl} ${baseDir}
    - addToStartMenu ${baseDir}/Code.exe
    - addPath --permanent ${baseDir}/bin

cmd.env:
    - addPath ${baseDir}/bin
